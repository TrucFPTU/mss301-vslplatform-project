server:
  port: 8084

spring:
  application:
    name: social-service
  config:
    import: "optional:configserver:${CONFIG_URI:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vsl_social}
    username: ${DB_USERNAME:vsl}
    password: ${DB_PASSWORD:vsl}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # Ảnh bìa bài viết (upload multipart)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

security:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1kZXZlbG9wbWVudC1zZWNyZXQta2V5LWZvci1oczI1Ni1hbGdvcml0aG0tMTIzNDU2}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 7

# Ảnh bìa bài viết lưu ở MinIO (bucket do social sở hữu).
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_USER:minioadmin}
  secret-key: ${MINIO_PASSWORD:minioadmin}
  buckets:
    - blog-thumbnails

# Hồ sơ công khai (tên, avatar) lấy từ identity; kiểm duyệt nội dung qua ai-service (Gemini).
identity-service:
  base-url: http://identity-service
  timeout: 3s
ai-service:
  base-url: http://ai-service
  timeout: 40s
moderation:
  # false = FAIL-CLOSED: ai-service lỗi thì chặn đăng (như monolith). Dev không chạy ai-service: đặt true.
  fail-open: ${MODERATION_FAIL_OPEN:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

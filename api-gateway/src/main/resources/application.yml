server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    # Chạy local (mvn spring-boot:run / IDE) tự đọc bí mật từ .env ở thư mục gốc; trong Docker không có file nên bỏ qua.
    import: "optional:configserver:${CONFIG_URI:http://localhost:8888},optional:file:.env[.properties],optional:file:../.env[.properties]"
  cloud:
    gateway:
      server:
        webmvc:            # 👈 namespace MỚI của bản WebMVC (không phải spring.cloud.gateway.mvc cũ)
          routes:
            # ---- Service đã tồn tại ----
            - id: template-service
              uri: lb://template-service       # lb:// = tìm địa chỉ qua Eureka
              predicates:
                - Path=/api/template/**

            # ---- Các service sẽ thêm sau (route dựng sẵn theo path) ----
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**,/api/users/**

            - id: learning-service
              uri: lb://learning-service
              predicates:
                - Path=/api/vocabularies/**,/api/categories/**,/api/practice/**,/api/attempts/**,/api/achievements/**,/api/vocabulary-suggestions/**,/api/favorites/**,/api/visits/**,/api/public/**

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**

            - id: social-service
              uri: lb://social-service
              predicates:
                - Path=/api/blogs/**,/api/comments/**,/api/follows/**,/api/notifications/**,/api/messages/**,/api/blocks/**

            # ---- Tài liệu OpenAPI của từng service cho Swagger UI chung (springdoc bên dưới) ----
            - id: identity-docs
              uri: lb://identity-service
              predicates:
                - Path=/api-docs/identity
              filters:
                - SetPath=/v3/api-docs
            - id: learning-docs
              uri: lb://learning-service
              predicates:
                - Path=/api-docs/learning
              filters:
                - SetPath=/v3/api-docs
            - id: ai-docs
              uri: lb://ai-service
              predicates:
                - Path=/api-docs/ai
              filters:
                - SetPath=/v3/api-docs
            - id: social-docs
              uri: lb://social-service
              predicates:
                - Path=/api-docs/social
              filters:
                - SetPath=/v3/api-docs

# Swagger UI chung: http://localhost:8080/swagger-ui.html — ô chọn ở góc trên đổi giữa 4 service.
# "Try it out" gọi qua chính gateway (service khai báo server "/", xem OpenApiAutoConfiguration ở common-lib).
springdoc:
  swagger-ui:
    urls:
      - name: identity-service
        url: /api-docs/identity
      - name: learning-service
        url: /api-docs/learning
      - name: ai-service
        url: /api-docs/ai
      - name: social-service
        url: /api-docs/social
    urls-primary-name: identity-service
    persist-authorization: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

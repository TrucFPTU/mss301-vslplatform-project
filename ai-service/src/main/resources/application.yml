server:
  port: 8083

spring:
  application:
    name: ai-service
  config:
    import: "optional:configserver:${CONFIG_URI:http://localhost:8888}"
  # Chấm điểm / chuyển mã trả CompletableFuture: mặc định Spring chỉ đợi ~30s, suy luận ONNX trên CPU (nhất là
  # lần đầu nạp model) lâu hơn -> bị cắt thành lỗi. Khớp read-timeout 120s phía learning-service.
  mvc:
    async:
      request-timeout: 120s
  # Video luyện tập có thể lớn → nới giới hạn upload.
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

security:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1kZXZlbG9wbWVudC1zZWNyZXQta2V5LWZvci1oczI1Ni1hbGdvcml0aG0tMTIzNDU2}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 7

# Đường dẫn file model ONNX (không đóng gói vào image; mount qua volume).
ai:
  model:
    path: ${AI_MODEL_PATH:./models/mvitv2_small.onnx}

# Gemini: kiểm duyệt blog/bình luận, phát hiện đăng lại, tìm từ đồng nghĩa.
# Không có key -> bỏ qua kiểm duyệt (cho đăng) để môi trường dev vẫn chạy.
gemini:
  api-key: ${GEMINI_API_KEY:}
  # Model lite: đủ cho kiểm duyệt, nhanh (5-15s). Ghim phiên bản (alias -latest tự đổi theo thời gian).
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  # Thử lần lượt khi model chính quá tải (429/503) hoặc không phản hồi.
  fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.1-flash-lite,gemini-2.5-flash-lite}
  enabled: ${GEMINI_ENABLED:true}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

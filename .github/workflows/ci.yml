# CI: mỗi lần push / mở PR → build + chạy toàn bộ unit test (mvn verify).
name: CI

on:
  push:
    branches: [dev, main, "feature/**", "fix/**"]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build + unit test
        run: mvn -B -ntp verify
      - name: Báo cáo test khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"

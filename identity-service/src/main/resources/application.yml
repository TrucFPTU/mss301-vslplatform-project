server:
  port: 8081

spring:
  application:
    name: identity-service
  config:
    # Chạy local (mvn spring-boot:run / IDE) tự đọc bí mật từ .env ở thư mục gốc; trong Docker không có file nên bỏ qua.
    import: "optional:configserver:${CONFIG_URI:http://localhost:8888},optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vsl_identity}
    username: ${DB_USERNAME:vsl}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # Avatar (upload multipart)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# Avatar lưu ở MinIO (bucket do identity sở hữu).
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_USER:minioadmin}
  secret-key: ${MINIO_PASSWORD}
  buckets:
    - avatars

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 7

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
